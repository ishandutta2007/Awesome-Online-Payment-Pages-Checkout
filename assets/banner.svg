<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#0a0d18; border-radius: 16px; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <defs>
    <!-- Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a14" />
      <stop offset="50%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#090d16" />
    </linearGradient>

    <linearGradient id="primaryTextGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="35%" stop-color="#818cf8" />
      <stop offset="70%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="accentGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0" />
    </linearGradient>

    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.6" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.5"/>
    </filter>

    <style>
      /* Dynamic Animated Background Elements - Kept strictly behind foreground text */
      @keyframes pulseGlow {
        0%, 100% { transform: scale(1) translate(0px, 0px); opacity: 0.35; }
        50% { transform: scale(1.15) translate(20px, -15px); opacity: 0.65; }
      }
      @keyframes floatSlow1 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-14px) rotate(2deg); }
      }
      @keyframes floatSlow2 {
        0%, 100% { transform: translateY(0px) rotate(0deg); }
        50% { transform: translateY(-18px) rotate(-2deg); }
      }
      @keyframes streamFlow {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: 0; }
      }
      @keyframes radarSweep {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes pillPulse {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 4px #38bdf8); }
        50% { opacity: 1; filter: drop-shadow(0 0 10px #818cf8); }
      }

      .bg-glow-1 {
        animation: pulseGlow 8s ease-in-out infinite;
        transform-origin: center;
      }
      .bg-glow-2 {
        animation: pulseGlow 10s ease-in-out infinite reverse;
        transform-origin: center;
      }
      .card-float-1 {
        animation: floatSlow1 6s ease-in-out infinite;
        transform-origin: center;
      }
      .card-float-2 {
        animation: floatSlow2 7.5s ease-in-out infinite;
        transform-origin: center;
      }
      .stream-line {
        stroke-dasharray: 20, 10;
        animation: streamFlow 12s linear infinite;
      }
      .status-pill {
        animation: pillPulse 3s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- Background Base Canvas -->
  <rect width="1200" height="360" fill="url(#bgGrad)" />

  <!-- Animated Background Glow Orbs (Layer 1 - deep background) -->
  <g opacity="0.45">
    <circle class="bg-glow-1" cx="200" cy="80" r="140" fill="#6366f1" filter="url(#glow)" />
    <circle class="bg-glow-2" cx="1020" cy="270" r="160" fill="#ec4899" filter="url(#glow)" />
    <circle class="bg-glow-1" cx="600" cy="330" r="120" fill="#0284c7" filter="url(#glow)" />
  </g>

  <!-- Geometric Grid Pattern Lines (Layer 2) -->
  <g stroke="#334155" stroke-opacity="0.25" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="180" x2="1200" y2="180" />
    <line x1="0" y1="240" x2="1200" y2="240" />
    <line x1="0" y1="300" x2="1200" y2="300" />
    <line x1="150" y1="0" x2="150" y2="360" />
    <line x1="300" y1="0" x2="300" y2="360" />
    <line x1="450" y1="0" x2="450" y2="360" />
    <line x1="600" y1="0" x2="600" y2="360" />
    <line x1="750" y1="0" x2="750" y2="360" />
    <line x1="900" y1="0" x2="900" y2="360" />
    <line x1="1050" y1="0" x2="1050" y2="360" />
  </g>

  <!-- Flowing Dynamic Streams (Layer 3 - Payment Data Streams) -->
  <path class="stream-line" d="M-50,80 C 250,20 400,160 700,90 C 950,30 1100,140 1250,110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.4" />
  <path class="stream-line" d="M-50,290 C 200,240 450,320 800,260 C 1000,210 1150,300 1250,280" fill="none" stroke="#a855f7" stroke-width="2" opacity="0.35" style="animation-direction: reverse;" />

  <!-- Dynamic Side Graphic Cards - Positioned on right edge to never obstruct center text (Layer 4) -->
  <g class="card-float-1" transform="translate(940, 45)" filter="url(#softShadow)">
    <rect width="210" height="120" rx="14" fill="url(#cardGrad1)" stroke="#38bdf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Simulated Credit/Payment Card mini chips -->
    <rect x="20" y="20" width="34" height="24" rx="4" fill="#fbbf24" opacity="0.85"/>
    <circle cx="160" cy="32" r="12" fill="#ef4444" opacity="0.75"/>
    <circle cx="178" cy="32" r="12" fill="#f59e0b" opacity="0.75"/>
    <rect x="20" y="65" width="120" height="8" rx="4" fill="#94a3b8" opacity="0.5"/>
    <rect x="20" y="82" width="70" height="8" rx="4" fill="#38bdf8" opacity="0.7"/>
    <text x="135" y="94" font-size="11" fill="#10b981" font-weight="600">PAID ✓</text>
  </g>

  <g class="card-float-2" transform="translate(970, 190)" filter="url(#softShadow)">
    <rect width="190" height="105" rx="14" fill="url(#cardGrad2)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1.5"/>
    <!-- Checkout Pill -->
    <rect x="18" y="18" width="80" height="20" rx="10" fill="#6366f1" opacity="0.8"/>
    <text x="32" y="32" font-size="10" fill="#ffffff" font-weight="bold">CHECKOUT</text>
    <circle class="status-pill" cx="160" cy="28" r="5" fill="#34d399"/>
    <!-- Checkout Metrics Bars -->
    <rect x="18" y="52" width="154" height="6" rx="3" fill="#1e293b"/>
    <rect x="18" y="52" width="125" height="6" rx="3" fill="#38bdf8"/>
    <text x="18" y="80" font-size="11" fill="#cbd5e1" font-weight="500">Fast 1-Click Pay</text>
    <text x="18" y="93" font-size="9" fill="#94a3b8">Multi-PSP Routing</text>
  </g>

  <!-- Left Side Small Floating Decorative Pill -->
  <g class="card-float-1" transform="translate(50, 45)" filter="url(#softShadow)">
    <rect width="180" height="54" rx="12" fill="url(#cardGrad1)" stroke="#64748b" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="28" cy="27" r="10" fill="#10b981" opacity="0.2"/>
    <text x="24" y="31" font-size="12" fill="#10b981">⚡</text>
    <text x="46" y="24" font-size="11" fill="#f8fafc" font-weight="600">Hosted Sessions</text>
    <text x="46" y="38" font-size="9" fill="#94a3b8">PCI DSS Level 1 Scope</text>
  </g>

  <g class="card-float-2" transform="translate(40, 240)" filter="url(#softShadow)">
    <rect width="190" height="54" rx="12" fill="url(#cardGrad1)" stroke="#818cf8" stroke-opacity="0.3" stroke-width="1"/>
    <circle cx="28" cy="27" r="10" fill="#818cf8" opacity="0.2"/>
    <text x="23" y="31" font-size="12" fill="#818cf8">🔐</text>
    <text x="46" y="24" font-size="11" fill="#f8fafc" font-weight="600">Tokenized Vault</text>
    <text x="46" y="38" font-size="9" fill="#94a3b8">3D Secure 2.0 Ready</text>
  </g>

  <!-- FOREGROUND LAYER: Title, Subtitle, Highlights & Badges (Prominent & Clear) -->
  <g transform="translate(600, 72)" text-anchor="middle">
    <!-- Top Pill Category Badge -->
    <rect x="-160" y="-38" width="320" height="28" rx="14" fill="#1e293b" stroke="#475569" stroke-width="1" />
    <circle class="status-pill" cx="-140" cy="-24" r="4" fill="#38bdf8" />
    <text x="5" y="-20" font-size="11" fill="#93c5fd" font-weight="bold" letter-spacing="1.5">CURATED DEVELOPER ECOSYSTEM</text>

    <!-- Main Title with Gradient Fill -->
    <text x="0" y="42" font-size="44" font-weight="900" fill="url(#primaryTextGrad)" letter-spacing="-0.5" filter="url(#softShadow)">
      Online Payment Pages &amp; Checkout
    </text>

    <!-- Subtitle -->
    <text x="0" y="86" font-size="16" fill="#e2e8f0" font-weight="400" letter-spacing="0.2">
      Hosted Checkout Sessions • Payment Links • Orchestration Engines • Self-Hosted Stacks
    </text>

    <!-- Visual Feature Chips Row -->
    <g transform="translate(0, 130)">
      <!-- Chip 1 -->
      <g transform="translate(-250, 0)">
        <rect x="-70" y="-14" width="140" height="28" rx="14" fill="#0f172a" stroke="#38bdf8" stroke-width="1" opacity="0.95"/>
        <text x="0" y="4" font-size="11" fill="#38bdf8" font-weight="600">💳 SaaS Checkouts</text>
      </g>
      <!-- Chip 2 -->
      <g transform="translate(-80, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#818cf8" stroke-width="1" opacity="0.95"/>
        <text x="0" y="4" font-size="11" fill="#a5b4fc" font-weight="600">⚡ Open Orchestration</text>
      </g>
      <!-- Chip 3 -->
      <g transform="translate(95, 0)">
        <rect x="-75" y="-14" width="150" height="28" rx="14" fill="#0f172a" stroke="#c084fc" stroke-width="1" opacity="0.95"/>
        <text x="0" y="4" font-size="11" fill="#e9d5ff" font-weight="600">🔗 Payment Links</text>
      </g>
      <!-- Chip 4 -->
      <g transform="translate(265, 0)">
        <rect x="-65" y="-14" width="130" height="28" rx="14" fill="#0f172a" stroke="#34d399" stroke-width="1" opacity="0.95"/>
        <text x="0" y="4" font-size="11" fill="#6ee7b7" font-weight="600">🛡️ Zero Take-Rate</text>
      </g>
    </g>

    <!-- Bottom Tech Tags -->
    <text x="0" y="195" font-size="12" fill="#64748b" font-weight="500" letter-spacing="1">
      STRIPE • PAYPAL • SQUARE • ADYEN • HYPERSWITCH • MEDUSA • BTCPAY • LAGO
    </text>
  </g>
</svg>
